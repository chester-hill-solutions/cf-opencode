name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # GitHub Packages needs an explicit token even inside Actions: GITHUB_TOKEN
      # cannot read these packages unless they are linked to the repository.
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: bun install --cwd runtime/opencode --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Run the local CI gate
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: bun run ci:local

  container-smoke:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and smoke-test the control plane
        run: bash scripts/smoke-container.sh
