name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:config
      - run: bun run typecheck
      - run: bun run build:ui
      - run: bun run test
      - run: bun run test:workers

  container-smoke:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and smoke-test the control plane
        run: bash scripts/smoke-container.sh
