name: Image

# Builds the conversation image and opens a digest-bump PR.
#
# The Conversation class declares two image references (`base` and `evented` in
# wrangler.jsonc). Both are digests in *different* repositories, so the image has
# to be pushed to each one: a deploy fails with "The image is invalid or does not
# exist in this account" when only one registry path received it.
#
# Requires, on the repository:
#   secret CLOUDFLARE_API_TOKEN  — Workers Scripts:Edit, Workers Containers:Edit,
#                                  Account Settings:Read (registry push + build)
#   variable CLOUDFLARE_ACCOUNT_ID — the Chester Hill Solutions account
#   variable IMAGE_CI = true     — enables the automatic run on Dockerfile changes
#
# Until IMAGE_CI is true only the manual dispatch runs; a push that changes the
# Dockerfile stays green and simply does not build, rather than failing on a
# missing secret.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (sha is always added)
        required: false
        default: ci
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - control-server.ts
      - runtime/opencode/**

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.IMAGE_CI == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      REGISTRY: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install cf
        run: npm install --global cf@1.0.0-beta.10

      - name: Build and push
        id: build
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?account id variable is required}"
          TAG="${{ github.event.inputs.tag || 'ci' }}"
          # One build per destination: `cf containers build` pushes to a single
          # repository, and the Conversation class needs both `base` and
          # `evented` to carry the same digest. The second build is a cache hit.
          for name in conversation-base conversation-evented; do
            cf containers build . -t "${REGISTRY}/cf-opencode-${name}:${TAG}" -p \
              | tee "/tmp/build-${name}.log"
          done
          BASE=$(grep -o 'sha256:[0-9a-f]\{64\}' /tmp/build-conversation-base.log | tail -1)
          EVENTED=$(grep -o 'sha256:[0-9a-f]\{64\}' /tmp/build-conversation-evented.log | tail -1)
          if [ -z "$BASE" ] || [ "$BASE" != "$EVENTED" ]; then
            echo "image digests differ or are missing: base=$BASE evented=$EVENTED" >&2
            exit 1
          fi
          echo "digest=$BASE" >> "$GITHUB_OUTPUT"

      - name: Repin the digest
        id: repin
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          python3 - "$DIGEST" <<'PY'
          import re, sys
          from pathlib import Path
          digest = sys.argv[1]
          path = Path("wrangler.jsonc")
          text = path.read_text()
          updated, count = re.subn(r"sha256:[0-9a-f]{64}", digest, text)
          if count != 2:
              raise SystemExit(f"expected 2 image entries, found {count}")
          path.write_text(updated)
          PY
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Open digest PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIGEST="${{ steps.repin.outputs.digest }}"
          BRANCH="chore/image-${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add wrangler.jsonc
          git commit -m "Repin conversation image to ${DIGEST:0:17}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Repin the conversation image" \
            --body "Built by the Image workflow from ${GITHUB_SHA}.

          Digest: \`${DIGEST}\`

          Verify after merge with \`cf containers ssh\` and \`python3 -c 'import openpyxl'\`."
